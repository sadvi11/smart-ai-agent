name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install linters
        run: pip install flake8

      # Real errors only — undefined names, syntax errors. These are the ones
      # that mean the code cannot run.
      - name: Lint (errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Style is advisory; a style nit should not read as a broken build.
      - name: Lint (style, advisory)
        run: flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Byte-compile all modules
        run: python -m compileall -q .

  test:
    name: API is wired to the agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Deliberately not the full requirements.txt: sentence-transformers pulls
      # torch, and these tests stub it out. Installing it would add minutes per
      # run and test PyTorch rather than this project's wiring.
      - name: Install test dependencies
        run: pip install flask flask-cors anthropic requests python-dotenv pytest

      # These exist because the lint job above passed for weeks while
      # POST /chat returned a hardcoded string and never called the agent.
      # Linting proves code parses; these prove it is connected.
      - name: Run API wiring tests
        run: python -m pytest tests/ -q
